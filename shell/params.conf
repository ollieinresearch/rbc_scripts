# Copy into a run directory and edit. Remember the #SBATCH lines in run_sim*.sh.
# Simulation
export RES_Z=192
export RES_HOR=$((RES_Z * 2))
export MESHX=24
export MESHY=24
export N=$((MESHX * MESHY))
export C=1
export RA=7
export PR=-2
export SIM_TIME=55
export STEPPER=RK222
export CFL=1
export CFL_SAFETY=0.333333
export CFL_THRESHOLD=0.1
export CFL_CADENCE=2
export DT=0.0005
export LX=2
export LY=2
export A_FREQ=0.005
export SNAPS_FREQ=0.0333333333
export SPEC_FREQ=0.05
export STATE_FREQ=3600      # wall seconds between checkpoints (a final one is always written)
export STATE_LAYOUT=c       # c: exact coefficients (3.4x smaller than grid); g: grid
export START_TIME=0
export IC=1
# export RESTART_FROM="$PWD/../64_Gam2_2"   # start from another run (e.g. lower resolution)
export PARA=virtual         # state/snapshots handler: virtual | mpio (Lustre MDS storms) | gather
export PAR_SMALL=virtual     # analysis/horizontal_analysis handlers (tiny data, one file)
export STOP_MARGIN=900      # seconds reserved for the final checkpoint
export GRACEFUL_STOP=1      # 0: no deadline, no signal handling (plain Ctrl+C / SIGTERM)
export WATCHDOG=1200        # s without progress -> dump stacks to watchdog/ and end the job (0 = off)
# export WATCHDOG_ALL=1     # dump every rank's stack, not just one per node
# export VAST_PATCH=0       # use Dedalus' own file-handler code instead of rbc.vast
# export FIXED_GET_FILE="$SCRATCH/rbc_scripts/3d/fixed_get_file.py"   # Mike's wrapper
# export SNAPSHOTS=1        # uncomment to save snapshots

# Post-processing / visualization
export AVG_TIME=auto
export FPS=30
export VIS_MODE=iso         # iso | volume
export VIS_JOBS=0          # frames rendered at once; 0 = as many as the cores and memory allow
export VIS_STRIDE=1

# Storage: every run lives under DATA_ROOT on scratch and is mirrored (same path below
# $SCRATCH) into each BACKUP_DIRS entry. Fir has no $PROJECT, hence the fallback.
export DATA_ROOT="$SCRATCH/ollie_rb_data/3d"
export BACKUP_DIRS="$HOME ${PROJECT:-/project/def-goluskin/$USER}"
export BACKUP_STATES=2      # newest checkpoints copied to each backup
export KEEP_STATES=4        # newest checkpoints kept on scratch (older ones deleted after a good backup)

# Paths
export SCRIPTS_PATH="$SCRATCH/rbc_scripts"
export SETUP_PATH="$SCRIPTS_PATH/shell/setup.sh"
export WORKFLOW_PATH="$SCRIPTS_PATH/shell/workflow.sh"
export ENV_PATH="$SCRATCH/ded3"
export VIS_ENV_PATH="$SCRATCH/ded3_vis"
