# bench.conf: what "python -m rbc.bench" benchmarks. Copy into a benchmark folder next to
# a params.conf (the physics, output settings and paths come from there). Every line
# is optional; commented values are the defaults.
#
# Step time does not depend on Ra or Pr, so results for a resolution apply to every run
# at that resolution. Ra, Pr and DT only need to give a stable run from rest.

# Resolution (stage 1)
RES_FLOOR=256          # lowest RES_Z your spectra accept (decade span >= 4); default: RES_Z
# RES_ABOVE=0.125      # also consider resolutions up to 12.5% above the floor
# Horizontal resolution (RES_HOR = modes in x and in y). Unset: it follows RES_Z at the
# ratio in params.conf (RES_HOR / RES_Z). Set, it varies independently, e.g. to refine
# the boundary layers without refining horizontally:
# RES_HOR_FLOOR=512    # lowest RES_HOR to consider
# RES_HOR_ABOVE=0      # also consider RES_HOR up to this fraction above (0: fixed horizontal)
# RES_BAND=0.15        # benchmark only those predicted within 15% of the cheapest
# RES_MAX=4            # at most this many resolutions
# ORIENT=larger        # mesh orientations: larger (larger dimension first) | both
# SQUARE=1             # also benchmark the most nearly square mesh (0: only the most balanced)

# Each job (one configuration on exactly its nodes): a short production job. The
# production outputs (params.conf) are built before the first step; memory is read on
# every node throughout (bench_mem.csv) and at the end.
# BENCH_SECONDS=600    # seconds of stepping, from the first step
# BENCH_DISCARD=60     # leading seconds not timed (first factorisations, plans, writes)
# BENCH_REHEARSAL=10   # steps of an unrecorded rehearsal launch first (warms the nodes)
# BENCH_TIME=          # wall-time request per job; default BENCH_SECONDS + 5 min (00:15:00).
#                      # If too short, stepping stops early enough to save the result anyway
#                      # ("truncated" in bench.csv).
# ACCOUNT=rrg-goluskin

# Memory (decides the node counts). Projected peak of a production job = memory per node at
# the end of the benchmark / BENCH_MEM_FRACTION.
# BENCH_MEM_FRACTION=0.80  # share of a JOB_HOURS job's peak reached after 10-15 min (about 0.80,
#                          # from production memory logs of 24 h jobs)
# JOB_HOURS=24         # production job length (BENCH_MEM_FRACTION is for this length)
# MEM_USABLE=747       # GiB a job can use per node; Trillium's value. On another cluster check
#                      # scontrol show node <node> | grep RealMemory
# MEM_HEADROOM=0.85    # plan for this fraction of it
# MEM_FIXED=90         # GiB per node independent of resolution, at 192 ranks per node
# BENCH_HISTORY=~/rbc_bench_history.csv  # every 10 min result, with its cluster; seeds the node
#                      # counts of later benchmarks on the same cluster (scaled by size)
# Used only without a 10 min measurement (no history yet, or results of the earlier short benchmark):
# MEM_PER_CELL=1.69e-4 # GiB per RES_Z^3 at the start of a job
# MEM_GROWTH=0.015     # growth per hour of a job
# MEM_FACTOR=1         # production / short-benchmark memory (about 4 for 256 on 5 nodes)

# Node count (stage 2)
# NODE_SPAN=2          # sweep from the memory minimum up to this multiple of it
# NODE_POINTS=6        # at most this many node counts
# NODE_MIN=            # lowest node count to sweep (overrides the memory estimate if larger)
# NODE_MAX=            # hard upper limit
# TIME_WEIGHT=1        # minimise node-hours x wall-time^TIME_WEIGHT (0: cheapest; larger: faster)

# Projections of wall time per job (SIM_TIME from params.conf). Default: mean timestep
# of the run in RESTART_FROM, scaled as 1/RES_Z.
# DT_REF=1.2e-4        # mean production timestep at resolution DT_REF_RES
# DT_REF_RES=256
# DT_REF_RES_HOR=512
